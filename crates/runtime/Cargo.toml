[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "runtime"
path = "src/lib.rs"

[[bin]]
name = "anri-runtime"
path = "src/main.rs"

[dependencies]
error          = { workspace = true }
config         = { workspace = true }
orm            = { workspace = true }
sql-translator = { path = "../sql-translator", version = "0.1" }
python-bridge  = { path = "../python-bridge", version = "0.1" }
session        = { path = "../session", version = "0.1" }
permissions    = { path = "../permissions", version = "0.1" }
metadata       = { path = "../metadata", version = "0.1" }
queue          = { path = "../queue", version = "0.1" }
http           = { path = "../http", version = "0.1" }
rust_apps_core = { path = "../../rust_apps/core", version = "0.1" }
async-trait    = "0.1"

kiff_logger    = { path = "../kiff_logger", version = "0.1" }
log_engine     = { path = "../log_engine", version = "0.1" }
kiff_sync      = { path = "../kiff_sync", version = "0.1" }
axum           = { workspace = true }
tower          = { workspace = true, features = ["limit"] }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap        = { workspace = true }
chrono         = { workspace = true }
pyo3           = { workspace = true }
tower-http     = { workspace = true }

[build-dependencies]
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
toml_edit      = "0.22"
